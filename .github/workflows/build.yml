name: Build, Test and Package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        homebridge: ['^1.8.0', '^2.0.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Switch to npm ci once the first dependency lockfile is generated and reviewed.
      - run: npm install --ignore-scripts
      - run: npm install --no-save --ignore-scripts 'homebridge@${{ matrix.homebridge }}'
      - run: npm run lint
      - run: npm test
      - run: npm run check:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Verify installed archive with production dependencies
        run: |
          archive=$(npm pack --ignore-scripts --silent)
          destination=$(mktemp -d)
          npm install --prefix "$destination" --omit=dev --ignore-scripts "$PWD/$archive" 'homebridge@${{ matrix.homebridge }}'
          node -e 'require(process.argv[1])' "$destination/node_modules/homebridge-anthemreceiver"
